<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Permission Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css" rel="stylesheet"/>
  <link href="/admin/assets/adminlte-shell.css" rel="stylesheet"/>
</head>
<body class="bg-light" data-page="permissions">
<div class="container py-3">
  <div class="page-header">
    <h4 class="page-title"><i class="fa-solid fa-key"></i> Cấu hình quyền</h4>
    <a href="/admin/permissions/list.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại</a>
  </div>
  <form id="form" class="card card-body form-shell">
    <div class="form-section-title">Thông tin quyền</div>
    <div class="row g-2">
      <div class="col-md-6"><input id="code" class="form-control" placeholder="Code" required/></div>
      <div class="col-md-6"><input id="name" class="form-control" placeholder="Name" required/></div>
      <div class="col-md-6"><input id="module" class="form-control" placeholder="Module"/></div>
      <div class="col-12"><textarea id="description" class="form-control" placeholder="Description"></textarea></div>
    </div>
    <div class="form-check my-3">
      <input id="isActive" class="form-check-input" type="checkbox" checked/><label class="form-check-label">Đang hoạt động</label>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1"></i>Lưu</button>
      <a href="/admin/permissions/list.html" class="btn btn-light border">Hủy</a>
    </div>
  </form>
</div>
<script>
(() => {
  const id = new URLSearchParams(location.search).get("id");
  async function load() {
    if (!id) return;
    const p = await (await fetch(`/api/permissions/${id}`)).json();
    ["code","name","module","description"].forEach(k => document.getElementById(k).value = p[k] || "");
    document.getElementById("isActive").checked = !!p.isActive;
    document.getElementById("code").readOnly = true;
  }
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      code: document.getElementById("code").value.trim(),
      name: document.getElementById("name").value.trim(),
      module: document.getElementById("module").value,
      description: document.getElementById("description").value,
      isActive: document.getElementById("isActive").checked
    };
    const url = id ? `/api/permissions/${id}` : "/api/permissions";
    const method = id ? "PUT" : "POST";
    const res = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    if (!res.ok) alert(await res.text());
    else location.href = "/admin/permissions/list.html";
  });
  load();
})();
</script>
<script src="/admin/assets/admin-shell-loader.js"></script>
</body>
</html>
