<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layoutPage(pageTitle=${isEdit} ? 'Sửa quyền' : 'Thêm quyền', content=~{:: content})}">
<body>
<th:block th:fragment="content">
  <div class="container-fluid">

    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin}">Trang quản trị</a></li>
        <li class="breadcrumb-item"><a th:href="@{/admin/permissions}">Quyền</a></li>
        <li class="breadcrumb-item active" th:text="${isEdit} ? 'Cập nhật' : 'Thêm mới'"></li>
      </ol>
    </nav>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0" style="max-width: 640px;">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0 fw-semibold">
          <i class="bi bi-shield-check me-2 text-primary"></i>
          <span th:text="${isEdit} ? 'Cập nhật quyền' : 'Thêm quyền'"></span>
        </h5>
      </div>
      <div class="card-body">
        <form th:action="@{/admin/permissions/save}" th:object="${permission}" method="post" novalidate accept-charset="UTF-8">
          <input type="hidden" th:field="*{id}" th:if="${isEdit}"/>
          <input type="hidden" name="isEdit" th:value="${isEdit}"/>

          <div class="mb-3">
            <label class="form-label fw-semibold">Mã quyền <span class="text-danger">*</span></label>
            <input type="text" th:field="*{code}"
                   th:class="'form-control' + (${#fields.hasErrors('code')} ? ' is-invalid' : '')"
                   maxlength="100" placeholder="VD: student.read" th:readonly="${isEdit}"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
            <small class="text-muted" th:if="${isEdit}">Mã không đổi sau khi tạo.</small>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Tên hiển thị <span class="text-danger">*</span></label>
            <input type="text" th:field="*{name}"
                   th:class="'form-control' + (${#fields.hasErrors('name')} ? ' is-invalid' : '')"
                   maxlength="150"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Module</label>
            <input type="text" th:field="*{module}" class="form-control" maxlength="100" placeholder="VD: students"/>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Mô tả</label>
            <textarea th:field="*{description}" class="form-control" rows="2" maxlength="255"></textarea>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" th:field="*{isActive}" id="permActive"/>
            <label class="form-check-label" for="permActive">Đang hoạt động</label>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i>
              <span th:text="${isEdit} ? 'Cập nhật' : 'Thêm mới'"></span>
            </button>
            <a th:href="@{/admin/permissions}" class="btn btn-outline-secondary">
              <i class="bi bi-x-lg me-1"></i> Hủy
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</th:block>
</body>
</html>
