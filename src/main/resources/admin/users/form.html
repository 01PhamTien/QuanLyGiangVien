<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css" rel="stylesheet"/>
  <link href="/admin/assets/adminlte-shell.css" rel="stylesheet"/>
</head>
<body class="bg-light" data-page="users">
<div class="container py-3">
  <div class="page-header">
    <h4 class="page-title"><i class="fa-solid fa-user-gear"></i> Thông tin tài khoản</h4>
    <a href="/admin/users/list.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại</a>
  </div>
  <form id="form" class="card card-body form-shell">
    <div class="form-section-title">Thông tin đăng nhập</div>
    <div class="row g-2">
      <div class="col-md-6"><input id="username" class="form-control" placeholder="Username" required/></div>
      <div class="col-md-6"><input id="password" class="form-control" placeholder="Password"/></div>
    </div>
    <div class="form-section-title mt-3">Thông tin cá nhân</div>
    <div class="row g-2">
      <div class="col-md-6"><input id="fullName" class="form-control" placeholder="Full name"/></div>
      <div class="col-md-6"><input id="email" class="form-control" placeholder="Email"/></div>
      <div class="col-md-6"><input id="phone" class="form-control" placeholder="Phone"/></div>
      <div class="col-md-6"><input id="avatarUrl" class="form-control" placeholder="Avatar URL"/></div>
    </div>
    <div class="form-section-title mt-3">Vai trò</div>
    <div id="roles" class="mb-2 border rounded p-2 bg-light-subtle"></div>
    <div class="form-check mb-3">
      <input id="isActive" class="form-check-input" type="checkbox" checked/><label class="form-check-label">Đang hoạt động</label>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1"></i>Lưu</button>
      <a href="/admin/users/list.html" class="btn btn-light border">Hủy</a>
    </div>
  </form>
</div>
<script>
(() => {
  const id = new URLSearchParams(location.search).get("id");
  async function loadRoles() {
    const roles = await (await fetch("/api/users/roles")).json();
    document.getElementById("roles").innerHTML = roles.map(r => `
      <div class="form-check">
        <input class="form-check-input role-cb" type="checkbox" value="${r.id}" id="r-${r.id}">
        <label class="form-check-label" for="r-${r.id}">${r.code} - ${r.name}</label>
      </div>`).join("");
  }
  async function loadUser() {
    if (!id) return;
    const u = await (await fetch(`/api/users/${id}`)).json();
    ["username","fullName","email","phone","avatarUrl"].forEach(k => document.getElementById(k).value = u[k] || "");
    document.getElementById("isActive").checked = !!u.isActive;
    document.getElementById("username").readOnly = true;
    const roleIds = new Set((u.roles || []).map(r => r.id));
    document.querySelectorAll(".role-cb").forEach(cb => cb.checked = roleIds.has(cb.value));
  }
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      username: document.getElementById("username").value.trim(),
      password: document.getElementById("password").value,
      fullName: document.getElementById("fullName").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value,
      avatarUrl: document.getElementById("avatarUrl").value,
      isActive: document.getElementById("isActive").checked,
      roleIds: [...document.querySelectorAll(".role-cb:checked")].map(x => x.value)
    };
    const url = id ? `/api/users/${id}` : "/api/users";
    const method = id ? "PUT" : "POST";
    const res = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    if (!res.ok) alert(await res.text());
    else location.href = "/admin/users/list.html";
  });
  loadRoles().then(loadUser);
})();
</script>
<script src="/admin/assets/admin-shell-loader.js"></script>
</body>
</html>
