<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layoutPage(pageTitle='Trang quản trị', content=~{:: content})}">
<body>
<th:block th:fragment="content">
  <div class="container-fluid">

    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb">
        <li class="breadcrumb-item active">Trang quản trị</li>
      </ol>
    </nav>

    <h4 class="fw-semibold mb-4">
      <i class="bi bi-grid-3x3-gap me-2 text-primary"></i>Chọn chức năng
    </h4>

    <div class="row g-4">
      <div class="col-12 col-md-6 col-xl-4">
        <a th:href="@{/admin/students}" class="text-decoration-none">
          <div class="card shadow-sm border-0 h-100 hover-shadow transition-all">
            <div class="card-body d-flex align-items-start gap-3">
              <div class="rounded-3 bg-primary bg-opacity-10 text-primary p-3">
                <i class="bi bi-mortarboard-fill fs-3"></i>
              </div>
              <div>
                <h5 class="card-title text-dark mb-1">Sinh viên</h5>
                <p class="card-text text-muted small mb-0">Danh sách, thêm và cập nhật hồ sơ sinh viên.</p>
              </div>
            </div>
          </div>
        </a>
      </div>
      <div class="col-12 col-md-6 col-xl-4">
        <a th:href="@{/admin/users}" class="text-decoration-none">
          <div class="card shadow-sm border-0 h-100 hover-shadow transition-all">
            <div class="card-body d-flex align-items-start gap-3">
              <div class="rounded-3 bg-info bg-opacity-10 text-info p-3">
                <i class="bi bi-people-fill fs-3"></i>
              </div>
              <div>
                <h5 class="card-title text-dark mb-1">Người dùng</h5>
                <p class="card-text text-muted small mb-0">Tài khoản đăng nhập và gán vai trò.</p>
              </div>
            </div>
          </div>
        </a>
      </div>
      <div class="col-12 col-md-6 col-xl-4">
        <a th:href="@{/admin/roles}" class="text-decoration-none">
          <div class="card shadow-sm border-0 h-100 hover-shadow transition-all">
            <div class="card-body d-flex align-items-start gap-3">
              <div class="rounded-3 bg-success bg-opacity-10 text-success p-3">
                <i class="bi bi-person-badge fs-3"></i>
              </div>
              <div>
                <h5 class="card-title text-dark mb-1">Vai trò</h5>
                <p class="card-text text-muted small mb-0">Quản lý role và gán quyền (permissions).</p>
              </div>
            </div>
          </div>
        </a>
      </div>
      <div class="col-12 col-md-6 col-xl-4">
        <a th:href="@{/admin/permissions}" class="text-decoration-none">
          <div class="card shadow-sm border-0 h-100 hover-shadow transition-all">
            <div class="card-body d-flex align-items-start gap-3">
              <div class="rounded-3 bg-warning bg-opacity-10 text-warning p-3">
                <i class="bi bi-shield-check fs-3"></i>
              </div>
              <div>
                <h5 class="card-title text-dark mb-1">Quyền</h5>
                <p class="card-text text-muted small mb-0">Định nghĩa mã quyền, module và mô tả.</p>
              </div>
            </div>
          </div>
        </a>
      </div>
    </div>

    <style>
      .hover-shadow { transition: box-shadow .2s ease, transform .2s ease; }
      a:hover .hover-shadow { box-shadow: 0 .5rem 1rem rgba(0,0,0,.1) !important; transform: translateY(-2px); }
    </style>
  </div>
</th:block>
</body>
</html>
