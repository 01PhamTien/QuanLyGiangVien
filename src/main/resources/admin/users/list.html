<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản lý người dùng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css" rel="stylesheet"/>
  <link href="/admin/assets/adminlte-shell.css" rel="stylesheet"/>
</head>
<body class="bg-light" data-page="users">
<div class="container py-3">
  <div class="page-header">
    <h4 class="page-title"><i class="fa-solid fa-users"></i> Quản lý người dùng</h4>
    <a href="/admin/users/form.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-user-plus me-1"></i> Thêm tài khoản</a>
  </div>

  <div class="card toolbar-card">
    <form id="searchForm" class="search-inline">
      <input id="keyword" class="form-control" placeholder="Tìm theo username, họ tên, email..."/>
      <button class="btn btn-primary" type="submit"><i class="fa-solid fa-magnifying-glass me-1"></i>Lọc</button>
      <button class="btn btn-outline-secondary" type="button" id="resetBtn"><i class="fa-solid fa-rotate-left me-1"></i>Làm mới</button>
    </form>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-bordered table-hover mb-0 bg-white">
          <thead><tr><th>#</th><th>Username</th><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th style="width:120px;"></th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const tbody = document.getElementById("tbody");
  const keyword = document.getElementById("keyword");
  const resetBtn = document.getElementById("resetBtn");
  let page = 0;
  async function load() {
    const p = new URLSearchParams({ page: String(page), size: "15", keyword: keyword.value.trim() });
    const res = await fetch(`/api/users/page?${p}`);
    const data = await res.json();
    if (!(data.content || []).length) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4"><i class="fa-regular fa-folder-open me-1"></i>Không có dữ liệu</td></tr>';
      return;
    }
    tbody.innerHTML = (data.content || []).map((u, i) => `
      <tr>
        <td>${i + 1 + page * 15}</td><td><code>${u.username || ""}</code></td><td>${u.fullName || "—"}</td><td>${u.email || "—"}</td>
        <td>${(u.roles || []).map(r => r.name).join(", ") || "—"}</td>
        <td><span class="status-badge ${u.isActive ? "active" : "inactive"}">${u.isActive ? "Đang hoạt động" : "Ngưng hoạt động"}</span></td>
        <td class="action-btns">
          <a class="btn btn-sm btn-outline-primary" href="/admin/users/form.html?id=${u.id}" title="Sửa"><i class="fa-solid fa-pen"></i></a>
          <button class="btn btn-sm btn-outline-danger" data-del="${u.id}" title="Xóa"><i class="fa-solid fa-trash"></i></button>
        </td>
      </tr>`).join("");
  }
  tbody.addEventListener("click", async (e) => {
    const id = e.target.getAttribute("data-del");
    if (!id) return;
    if (!confirm("Xóa người dùng?")) return;
    await fetch(`/api/users/${id}`, { method: "DELETE" });
    load();
  });
  document.getElementById("searchForm").addEventListener("submit", (e) => { e.preventDefault(); page = 0; load(); });
  resetBtn.addEventListener("click", () => { keyword.value = ""; page = 0; load(); });
  load();
})();
</script>
<script src="/admin/assets/admin-shell-loader.js"></script>
</body>
</html>
