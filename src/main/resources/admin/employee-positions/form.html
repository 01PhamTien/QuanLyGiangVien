<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Form vị trí nhân viên</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css" rel="stylesheet"/>
  <link href="/admin/assets/adminlte-shell.css" rel="stylesheet"/>
</head>
<body class="bg-light" data-page="employee-positions">
<div class="container py-3">
  <div class="page-header d-flex align-items-center justify-content-between gap-2 mb-3">
    <h4 class="page-title"><i class="fa-solid fa-arrows-left-right"></i> Vị trí nhân viên</h4>
    <a href="/admin/employee-positions/list.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại</a>
  </div>
  <div class="card">
    <div class="card-body">
      <div id="alertPlaceholder"></div>
      <form id="form" class="needs-validation" novalidate>
        <input type="hidden" id="id" />
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nhân viên</label>
            <select id="employeeId" class="form-select" required>
              <option value="">Chọn nhân viên</option>
            </select>
            <div class="invalid-feedback">Vui lòng chọn nhân viên.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Chức danh</label>
            <select id="positionId" class="form-select" required>
              <option value="">Chọn chức danh</option>
            </select>
            <div class="invalid-feedback">Vui lòng chọn chức danh.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Ngày bắt đầu</label>
            <input id="startDate" class="form-control" type="datetime-local" />
            <div class="invalid-feedback">Ngày bắt đầu không hợp lệ.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Ngày kết thúc</label>
            <input id="endDate" class="form-control" type="datetime-local" />
            <div class="invalid-feedback">Ngày kết thúc phải sau ngày bắt đầu.</div>
          </div>
          <div class="col-12">
            <label class="form-label">Ghi chú</label>
            <textarea id="note" class="form-control" rows="3"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Mô tả</label>
            <textarea id="description" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <div class="mt-4 d-flex gap-2">
          <button class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>Lưu</button>
          <a href="/admin/employee-positions/list.html" class="btn btn-light border">Hủy</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
(() => {
  const form = document.getElementById("form");
  const idInput = document.getElementById("id");
  const employeeSelect = document.getElementById("employeeId");
  const positionSelect = document.getElementById("positionId");
  const startDateInput = document.getElementById("startDate");
  const endDateInput = document.getElementById("endDate");
  const noteInput = document.getElementById("note");
  const descriptionInput = document.getElementById("description");
  const alertPlaceholder = document.getElementById("alertPlaceholder");

  function getQueryParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function showAlert(message, type = "danger") {
    alertPlaceholder.innerHTML = `
      <div class="alert alert-${type} alert-dismissible" role="alert">
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>`;
  }

  function resetValidation() {
    [employeeSelect, positionSelect, startDateInput, endDateInput].forEach(el => {
      el.classList.remove("is-invalid");
      el.setCustomValidity("");
    });
    form.classList.remove("was-validated");
  }

  function markInvalid(element, message) {
    element.classList.add("is-invalid");
    element.setCustomValidity(message);
  }

  function formatInputValue(dateString) {
    if (!dateString) return "";
    const date = new Date(dateString);
    if (Number.isNaN(date.getTime())) return "";
    const pad = (num) => String(num).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  async function loadEmployees() {
    const res = await fetch("/api/employees");
    const list = await res.json();
    employeeSelect.innerHTML = `<option value="">Chọn nhân viên</option>` +
      list.map(e => `<option value="${e.id}">${e.code || ""} - ${e.fullName || ""}</option>`).join("");
  }

  async function loadPositions() {
    const res = await fetch("/api/positions");
    const list = await res.json();
    positionSelect.innerHTML = `<option value="">Chọn chức danh</option>` +
      list.map(p => `<option value="${p.id}">${p.code || ""} - ${p.name || ""}</option>`).join("");
  }

  async function loadItem(id) {
    const res = await fetch(`/api/employee-positions/${id}`);
    if (!res.ok) {
      showAlert("Không thể tải dữ liệu vị trí nhân viên.");
      return;
    }
    const item = await res.json();
    idInput.value = item.id || "";
    employeeSelect.value = item.employeeId || "";
    positionSelect.value = item.positionId || "";
    startDateInput.value = formatInputValue(item.startDate);
    endDateInput.value = formatInputValue(item.endDate);
    noteInput.value = item.note || "";
    descriptionInput.value = item.description || "";
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    resetValidation();

    let valid = true;
    if (!employeeSelect.value) {
      markInvalid(employeeSelect, "Vui lòng chọn nhân viên.");
      valid = false;
    }
    if (!positionSelect.value) {
      markInvalid(positionSelect, "Vui lòng chọn chức danh.");
      valid = false;
    }
    if (startDateInput.value && endDateInput.value && new Date(endDateInput.value) < new Date(startDateInput.value)) {
      markInvalid(endDateInput, "Ngày kết thúc phải sau ngày bắt đầu.");
      valid = false;
    }

    if (!valid) {
      form.classList.add("was-validated");
      showAlert("Vui lòng sửa lại các lỗi hiển thị trên biểu mẫu.");
      return;
    }

    const payload = {
      employeeId: employeeSelect.value || null,
      positionId: positionSelect.value || null,
      startDate: startDateInput.value ? new Date(startDateInput.value).toISOString() : null,
      endDate: endDateInput.value ? new Date(endDateInput.value).toISOString() : null,
      note: noteInput.value.trim() || null,
      description: descriptionInput.value.trim() || null
    };
    const id = idInput.value;
    const url = id ? `/api/employee-positions/${encodeURIComponent(id)}` : "/api/employee-positions";
    const method = id ? "PUT" : "POST";
    const res = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      showAlert(await res.text());
      return;
    }
    window.location.href = "/admin/employee-positions/list.html";
  });

  Promise.all([loadEmployees(), loadPositions()]).then(() => {
    const id = getQueryParam("id");
    if (id) loadItem(id);
  }).catch(() => showAlert("Không thể tải dữ liệu nhân viên hoặc chức danh."));
})();
</script>
<script src="/admin/assets/admin-shell-loader.js"></script>
</body>
</html>
