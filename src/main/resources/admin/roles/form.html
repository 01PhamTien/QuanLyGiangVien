<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Role Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css" rel="stylesheet"/>
  <link href="/admin/assets/adminlte-shell.css" rel="stylesheet"/>
</head>
<body class="bg-light" data-page="roles">
<div class="container py-3">
  <div class="page-header">
    <h4 class="page-title"><i class="fa-solid fa-user-shield"></i> Cấu hình vai trò</h4>
    <a href="/admin/roles/list.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại</a>
  </div>
  <form id="form" class="card card-body form-shell">
    <div class="form-section-title">Thông tin cơ bản</div>
    <div class="row g-2">
      <div class="col-md-6"><input id="code" class="form-control" placeholder="Code" required/></div>
      <div class="col-md-6"><input id="name" class="form-control" placeholder="Name" required/></div>
      <div class="col-12"><textarea id="description" class="form-control" placeholder="Description"></textarea></div>
    </div>
    <div class="form-section-title mt-3">Phân quyền</div>
    <div id="permissions" class="mb-2 border rounded p-2 bg-light-subtle"></div>
    <div class="form-check mb-3">
      <input id="isActive" class="form-check-input" type="checkbox" checked/><label class="form-check-label">Đang hoạt động</label>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1"></i>Lưu</button>
      <a href="/admin/roles/list.html" class="btn btn-light border">Hủy</a>
    </div>
  </form>
</div>
<script>
(() => {
  const id = new URLSearchParams(location.search).get("id");
  async function loadPerms() {
    const perms = await (await fetch("/api/roles/permissions")).json();
    document.getElementById("permissions").innerHTML = perms.map(p => `
      <div class="form-check">
        <input class="form-check-input perm-cb" type="checkbox" value="${p.id}" id="p-${p.id}">
        <label class="form-check-label" for="p-${p.id}">${p.code} - ${p.name}</label>
      </div>`).join("");
  }
  async function loadRole() {
    if (!id) return;
    const r = await (await fetch(`/api/roles/${id}`)).json();
    ["code","name","description"].forEach(k => document.getElementById(k).value = r[k] || "");
    document.getElementById("isActive").checked = !!r.isActive;
    document.getElementById("code").readOnly = true;
    const permIds = new Set((r.permissions || []).map(p => p.id));
    document.querySelectorAll(".perm-cb").forEach(cb => cb.checked = permIds.has(cb.value));
  }
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      code: document.getElementById("code").value.trim(),
      name: document.getElementById("name").value.trim(),
      description: document.getElementById("description").value,
      isActive: document.getElementById("isActive").checked,
      permissionIds: [...document.querySelectorAll(".perm-cb:checked")].map(x => x.value)
    };
    const url = id ? `/api/roles/${id}` : "/api/roles";
    const method = id ? "PUT" : "POST";
    const res = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    if (!res.ok) alert(await res.text());
    else location.href = "/admin/roles/list.html";
  });
  loadPerms().then(loadRole);
})();
</script>
<script src="/admin/assets/admin-shell-loader.js"></script>
</body>
</html>
