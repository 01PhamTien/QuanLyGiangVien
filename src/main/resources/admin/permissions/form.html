<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Form phân quyền</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css" rel="stylesheet"/>
  <link href="/admin/assets/adminlte-shell.css" rel="stylesheet"/>
</head>
<body class="bg-light" data-page="permissions-form">
<div class="container py-3">
  <div class="page-header d-flex align-items-center justify-content-between gap-2 mb-3">
    <h4 class="page-title"><i class="fa-solid fa-key"></i> Quản lý phân quyền</h4>
    <a href="/admin/permissions/list.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại</a>
  </div>
  <div class="card">
    <div class="card-body">
      <div id="alertPlaceholder"></div>
      <form id="permissionForm">
        <input type="hidden" id="id"/>
        <div class="mb-3">
          <label class="form-label">Mã quyền</label>
          <input id="code" class="form-control" maxlength="100" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Tên quyền</label>
          <input id="name" class="form-control" maxlength="150" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Module</label>
          <input id="module" class="form-control" maxlength="100" placeholder="Ví dụ: users, roles, employees" />
        </div>
        <div class="mb-3">
          <label class="form-label">Mô tả</label>
          <textarea id="description" class="form-control" rows="3" maxlength="255"></textarea>
        </div>
        <div class="form-check mb-3">
          <input id="isActive" class="form-check-input" type="checkbox" checked />
          <label class="form-check-label">Đang hoạt động</label>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i> Lưu</button>
          <button type="button" id="cancelBtn" class="btn btn-outline-secondary">Hủy</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
(() => {
  const alertPlaceholder = document.getElementById("alertPlaceholder");
  const form = document.getElementById("permissionForm");
  const idInput = document.getElementById("id");
  const codeInput = document.getElementById("code");
  const nameInput = document.getElementById("name");
  const moduleInput = document.getElementById("module");
  const descInput = document.getElementById("description");
  const isActiveInput = document.getElementById("isActive");
  const cancelBtn = document.getElementById("cancelBtn");

  function getQueryParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }
  function showAlert(message, type = "danger") {
    alertPlaceholder.innerHTML = `
      <div class="alert alert-${type} alert-dismissible" role="alert">
        ${escapeHtml(message)}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>`;
  }
  function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value ?? "";
    return div.innerHTML;
  }
  async function loadPermission(id) {
    const res = await fetch(`/api/permissions/${id}`);
    if (!res.ok) {
      showAlert("Không thể tải dữ liệu quyền.");
      return;
    }
    const p = await res.json();
    idInput.value = p.id || "";
    codeInput.value = p.code || "";
    nameInput.value = p.name || "";
    moduleInput.value = p.module || "";
    descInput.value = p.description || "";
    isActiveInput.checked = p.isActive !== false;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const payload = {
      code: codeInput.value.trim(),
      name: nameInput.value.trim(),
      module: moduleInput.value.trim() || null,
      description: descInput.value.trim() || null,
      isActive: isActiveInput.checked,
    };
    const id = idInput.value;
    const url = id ? `/api/permissions/${encodeURIComponent(id)}` : "/api/permissions";
    const method = id ? "PUT" : "POST";
    const res = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const errorText = await res.text();
      showAlert(errorText || "Lưu không thành công.");
      return;
    }
    window.location.href = "/admin/permissions/list.html";
  });

  cancelBtn.addEventListener("click", () => {
    window.location.href = "/admin/permissions/list.html";
  });

  const editId = getQueryParam("id");
  if (editId) {
    loadPermission(editId);
  }
})();
</script>
<script src="/admin/assets/admin-shell-loader.js"></script>
</body>
</html>
