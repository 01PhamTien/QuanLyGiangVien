<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Form phòng ban</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css" rel="stylesheet"/>
  <link href="/admin/assets/adminlte-shell.css" rel="stylesheet"/>
</head>
<body class="bg-light" data-page="departments">
<div class="container py-3">
  <div class="page-header d-flex align-items-center justify-content-between gap-2 mb-3">
    <h4 class="page-title"><i class="fa-solid fa-building-columns"></i> Quản lý phòng ban</h4>
    <a href="/admin/departments/list.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại</a>
  </div>
  <div class="card">
    <div class="card-body">
      <div id="alertPlaceholder"></div>
      <form id="form" class="needs-validation" novalidate>
        <input type="hidden" id="id"/>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Mã phòng ban</label>
            <input id="code" class="form-control" placeholder="VD: DEP001" required />
            <div class="invalid-feedback">Mã phòng ban không được để trống.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Tên phòng ban</label>
            <input id="name" class="form-control" placeholder="VD: Phòng Công tác sinh viên" required />
            <div class="invalid-feedback">Tên phòng ban không được để trống.</div>
          </div>
          <div class="col-12">
            <label class="form-label">Mô tả</label>
            <textarea id="description" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <div class="mt-4 d-flex gap-2">
          <button class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>Lưu</button>
          <a href="/admin/departments/list.html" class="btn btn-light border">Hủy</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
(() => {
  const form = document.getElementById("form");
  const idInput = document.getElementById("id");
  const codeInput = document.getElementById("code");
  const nameInput = document.getElementById("name");
  const descriptionInput = document.getElementById("description");
  const alertPlaceholder = document.getElementById("alertPlaceholder");

  function getQueryParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function showAlert(message, type = "danger") {
    alertPlaceholder.innerHTML = `
      <div class="alert alert-${type} alert-dismissible" role="alert">
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>`;
  }

  function resetValidation() {
    [codeInput, nameInput].forEach(el => {
      el.classList.remove("is-invalid");
      el.setCustomValidity("");
    });
    form.classList.remove("was-validated");
  }

  function markInvalid(element, message) {
    element.classList.add("is-invalid");
    element.setCustomValidity(message);
  }

  async function loadDepartment(id) {
    const res = await fetch(`/api/departments/${id}`);
    if (!res.ok) {
      showAlert("Không thể tải thông tin phòng ban.");
      return;
    }
    const d = await res.json();
    idInput.value = d.id || "";
    codeInput.value = d.code || "";
    nameInput.value = d.name || "";
    descriptionInput.value = d.description || "";
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    resetValidation();

    let valid = true;
    if (!codeInput.value.trim()) {
      markInvalid(codeInput, "Mã phòng ban không được để trống.");
      valid = false;
    }
    if (!nameInput.value.trim()) {
      markInvalid(nameInput, "Tên phòng ban không được để trống.");
      valid = false;
    }

    if (!valid) {
      form.classList.add("was-validated");
      showAlert("Vui lòng sửa các lỗi trên biểu mẫu.");
      return;
    }

    const payload = {
      code: codeInput.value.trim(),
      name: nameInput.value.trim(),
      description: descriptionInput.value.trim() || null
    };
    const id = idInput.value;
    const url = id ? `/api/departments/${encodeURIComponent(id)}` : "/api/departments";
    const method = id ? "PUT" : "POST";
    const res = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      showAlert(await res.text());
      return;
    }
    window.location.href = "/admin/departments/list.html";
  });

  const id = getQueryParam("id");
  if (id) {
    loadDepartment(id);
  }
})();
</script>
<script src="/admin/assets/admin-shell-loader.js"></script>
</body>
</html>
